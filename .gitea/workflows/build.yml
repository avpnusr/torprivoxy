name: build

on:
  push:
    paths-ignore:
      - '.gitea/workflows/build.yml'
      - 'README.md'
      - 'renovate.json'
 #   schedule:
 #     - cron: "0 6 * * 6"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - run: | 
          echo "192.168.70.200 git.khmls.net" >> /etc/hosts
          echo "BDATE=$(date +%d-%m-%Y)" >> $GITHUB_ENV 
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: git.khmls.net
          username: ${{ vars.GITEAREG_USERNAME }}
          password: ${{ secrets.DOCKER_GITEA_REGISTRY_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          config-inline: |
            [registry."git.khmls.net"]
              mirrors = ["192.168.70.200"]    
      -
        name: Build and push alpine
        uses: docker/build-push-action@v7
        with:
          add-hosts: git.khmls.net:192.168.70.200
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          context: .
          file: Dockerfile
          push: true
          tags: |
            avpnusr/torprivoxy:latest
            avpnusr/torprivoxy:${{ env.BDATE }}
            git.khmls.net/klein/torprivoxy:latest
      -
        name: Build and push debian
        uses: docker/build-push-action@v7
        with:
          add-hosts: git.khmls.net:192.168.70.200
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          context: .
          file: Dockerfile.debian
          push: true
          tags: |
            avpnusr/torprivoxy:latest-debian
            avpnusr/torprivoxy:${{ env.BDATE }}-debian
            git.khmls.net/klein/torprivoxy:latest-debian