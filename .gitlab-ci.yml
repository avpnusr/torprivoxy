image: docker:latest

services:
  - docker:dind

stages:
  - build

variables:
  REPOSITORY: git.ddnss.org/klein/torprivoxy

before_script:
  - docker login -u $DOCKER_USERNAME -p $DOCKER_USERNAME

build:
  stage: build
  script:
    -  docker buildx build --push \
        --tag avpnusr/torprivoxy:latest \
        --platform linux/amd64,linux/arm/v7,linux/arm/v6,linux/arm64 \
        --file ./Dockerfile .
  only:
    - master
