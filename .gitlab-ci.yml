image: avpnusr/docker-buildx-qemu

variables:
  DOCKER_REPO: "avpnusr/torprivoxy"

build:
  stage: build
  before_script:
    - docker run -d --rm --privileged tonistiigi/binfmt --install all
    - echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin
    - XNAME=$RANDOM
    - BDATE=$(date +%d-%m-%Y)
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --name buildx-$XNAME --driver docker-container --use
    - docker buildx inspect --bootstrap

  script: 
    - docker buildx build --push --tag $DOCKER_REPO:latest --tag $DOCKER_REPO:$BDATE --platform linux/amd64,linux/arm/v7,linux/arm/v6,linux/arm64 --file ./Dockerfile .
    - docker buildx build --push --tag $DOCKER_REPO:latest-debian --tag $DOCKER_REPO:$BDATE-debian --platform linux/amd64,linux/arm/v7,linux/arm/v6,linux/arm64 --file ./Dockerfile.debian .
    - docker buildx rm buildx-$XNAME
    - rm -f ${HOME}/.docker/config.json