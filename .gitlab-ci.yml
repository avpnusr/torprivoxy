variables:
  DOCKER_REPO: "avpnusr/torprivoxy"
build:
  image: avpnusr/docker-buildx-qemu
  stage: build
  services:
    - docker:dind
  before_script:
    - echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin
    - XNAME=$RANDOM
    - BDATE=$(date +%d-%m-%Y)
    - docker buildx create --name buildx-$XNAME --driver docker-container --use
    - docker buildx inspect --bootstrap

  script: 
    - docker buildx build --push --tag $DOCKER_REPO:latest --tag $DOCKER_REPO:$BDATE --platform linux/amd64,linux/arm/v7,linux/arm/v6,linux/arm64 --file ./Dockerfile .
    - docker buildx rm buildx-$XNAME
    - rm -f ${HOME}/.docker/config.json
